<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | IdleWheels</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container form-container">
        <p class="eyebrow">Good to have you back</p>
        <h1>Log in</h1>
        <p>Sign in to manage your rides and conversations.</p>

        <p class="success" th:if="${param.registered}">
            Registration successful. You can now log in.
        </p>
        <p class="error" th:if="${loginError}" th:text="${loginError}"></p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required maxlength="150"
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required
                   autocomplete="current-password">

            <div class="form-actions"><button type="submit">Log in</button></div>
        </form>

        <p>Need an account? <a th:href="@{/register}">Register</a></p>
    </main>
</body>
</html>
