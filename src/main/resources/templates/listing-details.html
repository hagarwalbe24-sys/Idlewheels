<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${listing.title} | IdleWheels|">Listing details | IdleWheels</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <p><a th:href="@{/listings}">← Back to search</a></p>
    <div class="detail-layout">
        <section class="detail-panel">
            <img class="detail-photo" th:if="${photoUrl != null}" th:src="${photoUrl}" alt="Vehicle photo">
            <div class="listing-placeholder" th:if="${photoUrl == null}" aria-label="No vehicle photo">✦</div>
            <p class="eyebrow" th:text="${listing.vehicle.vehicleType}">VEHICLE</p>
            <p class="tag" th:if="${ownerPreview}" th:text="${listing.availableTo.isBefore(T(java.time.LocalDate).now()) ? 'Expired listing preview' : 'Inactive listing preview'}">Owner preview</p>
            <h1 th:text="${listing.title}">Listing title</h1>
            <h2 style="margin-top:8px">
                <span th:text="${listing.vehicle.make}">Make</span>
                <span th:text="${listing.vehicle.model}">Model</span>
            </h2>
            <p th:if="${listing.description != null}" th:text="${listing.description}"></p>
            <div class="detail-facts">
                <div class="fact"><small>Location</small><strong th:text="${listing.city}">City</strong></div>
                <div class="fact"><small>Year</small><strong th:text="${listing.vehicle.manufactureYear}">2020</strong></div>
                <div class="fact" th:if="${listing.vehicle.vehicleType.name() == 'CAR'}"><small>Seats & transmission</small><strong><span th:text="${listing.vehicle.seats}">5</span> seats · <span th:text="${listing.vehicle.transmission}">MANUAL</span></strong></div>
                <div class="fact" th:if="${listing.vehicle.vehicleType.name() == 'BIKE'}"><small>Engine capacity</small><strong><span th:text="${listing.vehicle.engineCc}">150</span> cc</strong></div>
                <div class="fact"><small>Available dates</small><strong><span th:text="${listing.availableFrom}">Start</span> – <span th:text="${listing.availableTo}">End</span></strong></div>
            </div>
        </section>
        <aside class="detail-panel">
            <p class="eyebrow">Your next ride</p>
            <h2 style="margin-top:0">Rental details</h2>
            <p class="price" style="font-size:1.6rem"><span th:text="${listing.pricePerDay}">0.00</span> / day</p>
            <p>Listed by <strong th:text="${listing.owner.name}">Owner</strong></p>
            <a class="button" th:if="${session.userRole == 'RENTER' and session.userId != listing.owner.id}"
               th:href="@{/messages/{listingId}/{otherUserId}(listingId=${listing.id},otherUserId=${listing.owner.id})}">Message owner</a>
            <p th:if="${session.userId == null}"><a th:href="@{/login}">Log in</a> to message the owner.</p>
        </aside>
    </div>
</main>
</body>
</html>
